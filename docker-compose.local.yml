version: '3.8'

services:
  aonsoku-bs:
    container_name: aonsoku-bs-local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - APP_USER=${APP_USER}
      - APP_PASSWORD=${APP_PASSWORD}
      - APP_AUTH_TYPE=${APP_AUTH_TYPE}
      - SERVER_URL=${SERVER_URL}
      - HIDE_SERVER=${HIDE_SERVER}
      # Navidrome server the Jam / Connect sync server verifies logins against.
      # Falls back to SERVER_URL when unset.
      - NAVIDROME_URL=${NAVIDROME_URL:-}
