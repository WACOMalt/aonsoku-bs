version: '3.8'

services:
  aonsoku:
    container_name: aonsoku
    build: .
    restart: unless-stopped
    ports:
      - 8097:8080
    environment:
      - APP_USER=${APP_USER}
      - APP_PASSWORD=${APP_PASSWORD}
      - APP_AUTH_TYPE=${APP_AUTH_TYPE}
      - SERVER_URL=${SERVER_URL}
      - HIDE_SERVER=${HIDE_SERVER}
      # Navidrome server the Jam / Connect sync server verifies logins against.
      # Falls back to SERVER_URL when unset.
      - NAVIDROME_URL=${NAVIDROME_URL:-}
      # Where the sync server keeps friends (see the volume below).
      - SYNC_DATA_DIR=/data
    volumes:
      # Friends, invites and friend settings, kept across rebuilds.
      - ./data/sync:/data
