name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_tag:
        description: Release tag
        required: true
        default: v0.x.x
      run_linux:
        description: Build for Linux?
        type: boolean
        default: true
      run_mac:
        description: Build for macOS?
        type: boolean
        default: true
      run_win:
        description: Build for Windows?
        type: boolean
        default: true
      run_web:
        description: Build web bundle?
        type: boolean
        default: true
      run_android:
        description: Build Android APK?
        type: boolean
        default: true
      run_ios:
        description: Build iOS IPA?
        type: boolean
        default: true

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.target_tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --title "Aonsoku $TAG" --generate-notes
          fi

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check execution logic
        id: check
        shell: bash
        run: |
          SHOULD_RUN="false"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            SHOULD_RUN="true"
          else
            if [[ "${{ matrix.os }}" == "macos-latest" && "${{ inputs.run_mac }}" == "true" ]]; then SHOULD_RUN="true"; fi
            if [[ "${{ matrix.os }}" == "ubuntu-latest" && "${{ inputs.run_linux }}" == "true" ]]; then SHOULD_RUN="true"; fi
            if [[ "${{ matrix.os }}" == "windows-2022" && "${{ inputs.run_win }}" == "true" ]]; then SHOULD_RUN="true"; fi
          fi

          echo "SHOULD_RUN=$SHOULD_RUN" >> $GITHUB_ENV
          echo "Decision for ${{ matrix.os }}: $SHOULD_RUN"

      - name: Checkout repository
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@v4

      - name: Set Release Tag (Manual Workflow Dispatch)
        if: env.SHOULD_RUN == 'true' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: echo "GITHUB_REF=refs/tags/${{ inputs.target_tag }}" >> $GITHUB_ENV

      - name: Install pnpm
        if: env.SHOULD_RUN == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js and cache
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Main/Renderer
        if: env.SHOULD_RUN == 'true'
        env:
          MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.MAIN_VITE_DISCORD_CLIENT_ID }}
        run: pnpm electron:build

      - name: Build and Release (macOS)
        if: env.SHOULD_RUN == 'true' && matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:build:mac

      - name: Build and Release (Windows)
        if: env.SHOULD_RUN == 'true' && matrix.os == 'windows-2022'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:build:win

      - name: Install Linux dependencies
        if: env.SHOULD_RUN == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Build and Release (Linux)
        if: env.SHOULD_RUN == 'true' && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm ci:build:linux

  web:
    name: Web bundle
    needs: prepare
    if: github.event_name == 'push' || inputs.run_web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js and cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web bundle
        run: pnpm build

      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSET="Aonsoku-${VERSION}-web.zip"
          (cd dist && zip -qr "../$ASSET" .)
          ls -la "$ASSET"
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android APK
    needs: prepare
    if: github.event_name == 'push' || inputs.run_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.9.0

      - name: Setup Node.js and cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build web assets
        run: pnpm build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Warn about debug signing
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; the APK will be signed with an ephemeral debug key."

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$HAS_KEYSTORE" == "true" ]]; then
            ASSET="Aonsoku-${VERSION}-android.apk"
          else
            ASSET="Aonsoku-${VERSION}-android-debugsigned.apk"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "$ASSET"
          ls -la "$ASSET"
          gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  ios:
    name: iOS
    needs: prepare
    if: github.event_name == 'push' || inputs.run_ios
    permissions:
      contents: write
    uses: ./.github/workflows/ios.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [prepare, desktop, web, android, ios]
    if: always() && needs.prepare.result == 'success' && needs.desktop.result == 'success' && needs.web.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ "${{ needs.android.result }}" != "success" ]]; then
            echo "::warning::Android job result: ${{ needs.android.result }} - publishing without a fresh APK."
          fi
          if [[ "${{ needs.ios.result }}" != "success" ]]; then
            echo "::warning::iOS job result: ${{ needs.ios.result }} - publishing without an IPA."
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
