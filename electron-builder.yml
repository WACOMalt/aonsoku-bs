# The appId stays the original one: Windows knows the installed app by it,
# so an update replaces the old install instead of adding a second one.
appId: com.victoralvesf.aonsoku
productName: Aonsoku-BS
copyright: Copyright © 2026 Victor Alves
icon: ./build/icon.ico
artifactName: '${productName}-v${version}-${os}-${arch}.${ext}'

directories:
  buildResources: build

files:
  - '!**/*'
  - 'out/**'
  - '!out/renderer/screenshots{,/**}'
  - 'package.json'

extraResources:
  - from: resources
    to: resources

win:
  executableName: Aonsoku-BS
  target:
    - target: nsis
      arch:
        - x64
        - arm64

nsis:
  shortcutName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  license: ./LICENSE.txt
  uninstallerIcon: ./build/icon.ico

mac:
  category: public.app-category.music
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  identity: "-"
  icon: ./build/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
    - deb
  executableName: aonsoku-bs
  maintainer: victoralvesf
  category: AudioVideo
  synopsis: 'A modern desktop music client for Navidrome and OpenSubsonic servers.'

# The package was called "aonsoku" before "aonsoku-bs": installing it
# replaces that one rather than clashing with it.
deb:
  fpm:
    - --replaces=aonsoku
    - --conflicts=aonsoku

# aonsoku://jam/<id> invite links open in the desktop app.
protocols:
  - name: Aonsoku-BS Jam
    schemes:
      - aonsoku

npmRebuild: true
nativeRebuilder: legacy

publish:
  provider: github
  owner: WACOMalt
  repo: aonsoku-bs
