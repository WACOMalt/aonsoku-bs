<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Shareable links are paths like /jam/<id> or /album/<id> so the
      // Android app can claim them, but the app routes with a hash. Hop to
      // #/album/<id> before anything else loads; relative asset paths would
      // not resolve under /album/.
      (function () {
        var m = location.pathname.match(
          /^(.*)\/(jam|song|album|artist|playlist)\/([A-Za-z0-9._-]{1,64})\/?$/
        )
        if (m) location.replace(m[1] + '/#/' + m[2] + '/' + m[3])
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aonsoku-BS</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="manifest" href="/favicons/site.webmanifest">
    <link rel="mask-icon" href="/favicons/safari-pinned-tab.svg" color="#20b358">
    <meta name="msapplication-TileColor" content="#20b358">
    <meta name="theme-color" content="#20b358">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="./env-config.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
